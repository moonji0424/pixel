<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>픽셀</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* Miro 토큰 */
  --primary:#1c1c1e; --on-primary:#ffffff;
  --brand-yellow:#ffd02f; --yellow-light:#fff4c4; --yellow-dark:#746019;
  --brand-blue:#4262ff;
  --coral-light:#ffc6c6; --coral-dark:#600000;
  --teal-light:#c3faf5; --moss-dark:#187574;
  --rose-light:#fde0f0;
  --canvas:#ffffff; --surface:#f7f8fa; --surface-soft:#fafbfc; --surface-yellow:#fff8e0;
  --hairline:#e0e2e8; --hairline-soft:#eef0f3; --hairline-strong:#c7cad5;
  --ink-deep:#050038; --ink:#1c1c1e; --charcoal:#2c2c34;
  --slate:#555a6a; --steel:#6b6f7e; --stone:#8e91a0; --muted:#a5a8b5;

  /* 제품(게임판) 토큰 */
  --cell:70px; --gap:8px;
  --leaf-hi:#A6DB55; --leaf:#8CC63F; --leaf-mid:#79B32C;
  --cell-face:#93C93F; --cell-hole:#84BC30; --plate:#FBFBF6;
  --blue:#2F62A8; --orange:#EE7623; --yellow:#F2C022; --pink:#D33B78;

  --font:"Roobert PRO","Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--canvas);color:var(--ink);
  min-height:100vh;padding:24px 24px 48px;-webkit-font-smoothing:antialiased}

/* ---------- 헤더 ---------- */
.top{max-width:1440px;margin:0 auto 24px;display:flex;flex-wrap:wrap;align-items:center;gap:20px 24px}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:64px;height:auto;display:block;flex:none}
.brand h1{font-size:48px;font-weight:500;line-height:1.15;letter-spacing:-1px;margin:0}
.brand p{margin:6px 0 0;color:var(--slate);font-size:18px;line-height:1.5}
.tabs{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.tab{font-family:var(--font);font-size:16px;font-weight:500;line-height:1.3;
  background:var(--canvas);color:var(--steel);border:1px solid var(--hairline);
  padding:14px 26px;border-radius:9999px;cursor:pointer;transition:background .18s ease,color .18s ease}
.tab[aria-selected="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tab:focus-visible{outline:2px solid var(--brand-blue);outline-offset:2px}

/* ---------- 레이아웃 ---------- */
.stage{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:44px;align-items:start}
@media (max-width:1439px){
  :root{--cell:56px;--gap:6px}
  .top,.stage{max-width:1160px}
  .stage{grid-template-columns:minmax(0,1fr) 380px;gap:40px}
  .brand h1{font-size:36px}
  .brand img{width:52px}
}
@media (max-width:1023px){
  :root{--cell:48px;--gap:6px}
  .stage{grid-template-columns:1fr;gap:32px}
}
.board-wrap{display:flex;justify-content:center;background:var(--canvas);
  border:1px solid var(--hairline-soft);border-radius:16px;padding:28px;
  box-shadow:rgba(5,0,56,.08) 0 12px 32px -4px}

/* ---------- 게임판 ---------- */
.board{position:relative;padding:26px 26px 48px 48px;border-radius:32px;
  background:linear-gradient(160deg,var(--leaf-hi) 0%,var(--leaf) 38%,var(--leaf-mid) 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -6px 14px rgba(0,0,0,.16)}
.plate{position:relative;padding:14px;border-radius:12px;background:var(--plate);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.grid{display:grid;grid-template-columns:repeat(8,var(--cell));grid-auto-rows:var(--cell);gap:var(--gap);position:relative;z-index:2}
.cell{position:relative;border:0;padding:0;margin:0;border-radius:8px;background:var(--cell-face);
  cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.10)}
.cell::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--cell-hole);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.20),inset 0 -2px 0 rgba(255,255,255,.28)}
.cell.blank{background:transparent;box-shadow:none;cursor:default}
.cell.blank::after{display:none}
.cell:focus-visible{outline:2px solid var(--brand-blue);outline-offset:2px;z-index:5}
.band{position:absolute;z-index:1;border-radius:8px;background:rgba(66,98,255,.16);
  transition:opacity .18s ease;pointer-events:none}
.band.dim{opacity:.3}
.hidden{display:none !important}
.cross{position:absolute;z-index:4;pointer-events:none;border-radius:10px;
  box-shadow:0 0 0 4px var(--primary),0 0 0 8px rgba(255,255,255,.8)}
.cell .target{position:absolute;inset:0;z-index:3;display:grid;place-items:center;
  font-size:32px;color:#FFF;text-shadow:0 2px 4px rgba(0,0,0,.35)}
.cell .mark{position:absolute;inset:9px;z-index:3;border-radius:50%;background:#FFF;opacity:.92;
  box-shadow:0 1px 3px rgba(0,0,0,.3)}
.cell.win-line{box-shadow:0 0 0 4px var(--brand-yellow),inset 0 -2px 0 rgba(0,0,0,.10);z-index:5}
.chip{position:absolute;inset:3px;z-index:3;border-radius:50%;
  box-shadow:inset 0 -3px 5px rgba(0,0,0,.28),inset 0 3px 4px rgba(255,255,255,.45),0 1px 2px rgba(0,0,0,.3)}
.chip.blue{background:var(--blue)}.chip.orange{background:var(--orange)}
.chip.yellow{background:var(--yellow)}.chip.pink{background:var(--pink)}
.rail{position:absolute;background:rgba(0,0,0,.30);border-radius:9999px;box-shadow:inset 0 2px 4px rgba(0,0,0,.45)}
.rail-left{left:20px;top:26px;bottom:48px;width:12px}
.rail-bottom{left:48px;right:26px;bottom:20px;height:12px}
.handle{position:absolute;z-index:6;border:0;padding:0;cursor:grab;background:var(--primary);border-radius:6px;
  box-shadow:0 2px 4px rgba(0,0,0,.45);touch-action:none}
.handle::after{content:"";position:absolute}
.handle-row{width:30px;height:22px;left:11px;transform:translateY(-50%)}
.handle-row::after{right:-9px;top:50%;transform:translateY(-50%);
  border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:10px solid var(--primary)}
.handle-col{height:30px;width:22px;bottom:11px;transform:translateX(-50%)}
.handle-col::after{top:-9px;left:50%;transform:translateX(-50%);
  border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:10px solid var(--primary)}
.handle:focus-visible{outline:2px solid #FFF;outline-offset:3px}
.handle.locked{background:var(--stone);cursor:not-allowed}
.handle.locked::after{border-left-color:var(--stone);border-bottom-color:var(--stone)}

/* ---------- 패널 ---------- */
.panel{background:var(--canvas);border:1px solid var(--hairline-soft);border-radius:28px;padding:36px}
.panel h2{margin:0 0 6px;font-size:28px;font-weight:500;line-height:1.25;letter-spacing:-.3px}
.step{color:var(--steel);font-size:15px;line-height:1.4;margin:0 0 18px}
.task{font-size:18px;line-height:1.50;color:var(--slate);margin:0 0 22px}
.turnbar{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:9999px;
  padding:10px 20px;margin:0 0 22px;font-size:16px;font-weight:500}
.swatch{width:28px;height:28px;border-radius:50%;flex:none;
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.28),inset 0 2px 3px rgba(255,255,255,.45)}
.rulechip{margin-left:auto;font-size:15px;font-weight:600;color:var(--yellow-dark);
  background:var(--surface-yellow);border-radius:9999px;padding:4px 10px}
.feedback{border-radius:20px;padding:22px;font-size:16px;line-height:1.55;
  background:var(--surface);color:var(--slate);min-height:104px}
.feedback.good{background:var(--teal-light);color:var(--moss-dark)}
.feedback.bad{background:var(--coral-light);color:var(--coral-dark)}
.feedback strong{display:block;margin-bottom:6px;font-size:19px;font-weight:500;color:inherit}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
button.act{font-family:var(--font);font-size:16px;font-weight:500;line-height:1.3;cursor:pointer;
  border-radius:9999px;padding:15px 30px;min-height:54px;
  background:var(--canvas);color:var(--ink);border:1px solid var(--hairline-strong);
  transition:background .18s ease}
button.act.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
button.act.primary:not(:disabled):hover{background:var(--charcoal)}
button.act:not(.primary):not(:disabled):hover{background:var(--surface)}
button.act:disabled{background:var(--hairline);color:var(--muted);border-color:var(--hairline);cursor:not-allowed}
button.act:focus-visible{outline:2px solid var(--brand-blue);outline-offset:2px}
.divider{height:1px;background:var(--hairline-soft);margin:24px 0}
.hint{font-size:15px;line-height:1.55;color:var(--steel);margin:0}
.tray{display:flex;flex-direction:column;gap:8px}
.tray-row{display:flex;align-items:center;gap:14px;padding:13px 20px;border-radius:9999px;
  background:var(--canvas);border:1px solid var(--hairline);width:100%;cursor:pointer;
  font-family:var(--font);font-size:16px;font-weight:500;color:var(--ink);text-align:left;min-height:54px}
.tray-row[aria-pressed="true"]{border-color:var(--primary);background:var(--surface)}
.tray-row:disabled{opacity:.45;cursor:not-allowed}
.count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--steel);font-weight:400}
.seg{display:flex;gap:8px;margin-bottom:16px}
.seg button{flex:1;font-family:var(--font);font-size:16px;font-weight:500;cursor:pointer;
  border:1px solid var(--hairline);background:var(--canvas);color:var(--steel);
  padding:14px 0;border-radius:9999px;min-height:54px}
.seg button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.total{font-size:15px;color:var(--steel);margin:16px 0 0;text-align:right;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:12px;font-size:16px;margin:18px 0 0;cursor:pointer;color:var(--ink)}
.toggle input{width:22px;height:22px;accent-color:var(--brand-blue)}

@media (max-width:767px){
  body{padding:20px 16px 48px}
  .brand h1{font-size:28px}
  .brand img{width:40px}
  :root{--cell:38px;--gap:5px}
  .panel{padding:24px;border-radius:20px}
  .board-wrap{padding:20px 12px}
}
@media (max-width:479px){
  :root{--cell:32px;--gap:4px}
  .brand h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

<script>
(function(){
"use strict";
const ROWS=8,COLS=8;
const BLOCKED=new Set(["1-1","1-8","8-1","8-8"]);
const KO={blue:"파랑",orange:"주황",yellow:"노랑",pink:"분홍"};
const SETUP={2:{blue:30,orange:30},3:{blue:20,orange:20,yellow:20},4:{blue:15,orange:15,yellow:15,pink:15}};
const ART_STOCK={blue:30,orange:30,yellow:20,pink:15};
const DIRS=[[0,1],[1,0],[1,1],[1,-1]];
const CSS={blue:"#2F62A8",orange:"#EE7623",yellow:"#F2C022",pink:"#D33B78"};

const grid=document.getElementById("grid"),board=document.getElementById("board");
const bandRow=document.getElementById("bandRow"),bandCol=document.getElementById("bandCol");
const cross=document.getElementById("cross");
const handleRow=document.getElementById("handleRow"),handleCol=document.getElementById("handleCol");
const railL=document.getElementById("railL"),railB=document.getElementById("railB");
const cells={};

const S={mode:"mission",row:4,col:4,moved:null,chips:new Map(),marks:new Set(),winCells:[],
  history:[],people:4,turnColor:"blue",inventory:{},
  mIndex:0,mDone:false,qIndex:0,qDone:false,locked:false,
  artColor:"blue",artStock:{},artMirror:false};

for(let r=1;r<=ROWS;r++)for(let c=1;c<=COLS;c++){
  const key=r+"-"+c,blank=BLOCKED.has(key);
  const el=document.createElement(blank?"div":"button");
  el.className="cell"+(blank?" blank":"");
  el.dataset.r=r;el.dataset.c=c;
  if(!blank)el.setAttribute("aria-label","위에서 "+r+"번째 줄, 왼쪽에서 "+c+"번째 칸");
  grid.appendChild(el);cells[key]=el;
}
const isBlank=(r,c)=>BLOCKED.has(r+"-"+c);
const chipAt=(r,c)=>S.chips.get(r+"-"+c);
const pos=(r,c)=>"위에서 "+r+"번째 줄, 왼쪽에서 "+c+"번째 칸";

function lineCells(chips,r,c,color,dr,dc){
  const out=[[r,c]];
  for(let k=1;k<8;k++){const R=r+dr*k,C=c+dc*k;if(chips.get(R+"-"+C)!==color)break;out.push([R,C]);}
  for(let k=1;k<8;k++){const R=r-dr*k,C=c-dc*k;if(chips.get(R+"-"+C)!==color)break;out.unshift([R,C]);}
  return out;
}
const DIRNAME={"0,1":"가로줄","1,0":"세로줄","1,1":"대각선","1,-1":"대각선"};
function winningLines(chips,r,c,color,len){
  if(isBlank(r,c)||chips.has(r+"-"+c))return [];
  const out=[];
  for(const[dr,dc]of DIRS){
    const L=lineCells(chips,r,c,color,dr,dc);
    if(L.length>=len)out.push({cells:L,name:DIRNAME[dr+","+dc]});
  }
  return out;
}
function winningLine(chips,r,c,color,len){
  const w=winningLines(chips,r,c,color,len);
  return w.length?w[0].cells:null;
}
function mergeCells(lines){
  const seen=new Set(),out=[];
  lines.forEach(L=>L.cells.forEach(([r,c])=>{
    const k=r+"-"+c; if(!seen.has(k)){seen.add(k);out.push([r,c]);}
  }));
  return out;
}
function lineNames(lines){
  const names=[...new Set(lines.map(l=>l.name))];
  return names.join("과 ");
}
const winLen=n=>n===4?3:4;

function layout(){
  const s=cells["4-4"],cw=s.offsetWidth,ch=s.offsetHeight;
  const t=cells[S.row+"-"+S.col],x=t.offsetLeft,y=t.offsetTop;
  bandRow.style.cssText="left:0;width:"+grid.offsetWidth+"px;top:"+(grid.offsetTop+y-3)+"px;height:"+(ch+6)+"px";
  bandCol.style.cssText="top:0;height:"+grid.offsetHeight+"px;left:"+(grid.offsetLeft+x-3)+"px;width:"+(cw+6)+"px";
  cross.style.cssText="left:"+(grid.offsetLeft+x)+"px;top:"+(grid.offsetTop+y)+"px;width:"+cw+"px;height:"+ch+"px";
  bandRow.classList.toggle("dim",S.moved==="col");
  bandCol.classList.toggle("dim",S.moved==="row");
  const noSlider=S.mode==="art";
  const hide=noSlider||S.locked;
  [bandRow,bandCol,cross].forEach(e=>e.classList.toggle("hidden",hide));
  [handleRow,handleCol,railL,railB].forEach(e=>e.classList.toggle("hidden",noSlider));
  if(!noSlider){
    const bp=board.getBoundingClientRect(),gp=grid.getBoundingClientRect();
    handleRow.style.top=(gp.top-bp.top+y+ch/2)+"px";
    handleCol.style.left=(gp.left-bp.left+x+cw/2)+"px";
  }
}
window.addEventListener("resize",layout);

function render(){
  for(const key in cells){
    const el=cells[key];
    el.querySelectorAll(".chip,.target,.mark").forEach(n=>n.remove());
    el.classList.remove("win-line");
    const color=S.chips.get(key);
    if(color){const d=document.createElement("div");d.className="chip "+color;el.appendChild(d);}
    if(S.marks.has(key)){const d=document.createElement("div");d.className="mark";el.appendChild(d);}
  }
  if(S.mode==="mission"){
    const m=MISSIONS[S.mIndex];
    if(m.target){const t=document.createElement("div");t.className="target";t.textContent="★";
      cells[m.target.r+"-"+m.target.c].appendChild(t);}
  }
  S.winCells.forEach(([r,c])=>cells[r+"-"+c].classList.add("win-line"));
  handleRow.classList.toggle("locked",S.locked||S.moved==="col");
  handleCol.classList.toggle("locked",S.locked||S.moved==="row");
  layout();
  if(S.mode==="art")renderArtTray();
}
function say(id,kind,title,body){
  const b=document.getElementById(id);
  b.className="feedback"+(kind?" "+kind:"");
  b.innerHTML="<strong></strong><span></span>";
  b.querySelector("strong").textContent=title;
  b.querySelector("span").textContent=body;
}
const fid=()=>({mission:"mFeedback",quiz:"qFeedback",art:"artFeedback"})[S.mode];

function moveSlider(which,value){
  if(S.locked||S.mode==="art")return false;
  if(S.moved&&S.moved!==which){
    say(fid(),"bad","슬라이더는 하나만",
      "이번 차례에는 이미 다른 슬라이더를 움직였어요. 바꾸고 싶으면 ‘다시 하기’로 처음부터 해 보세요.");
    return false;
  }
  value=Math.max(1,Math.min(which==="row"?ROWS:COLS,value));
  if(which==="row"){if(value===S.row)return true;S.row=value;}
  else{if(value===S.col)return true;S.col=value;}
  S.moved=which;render();return true;
}

grid.addEventListener("click",e=>{
  const el=e.target.closest(".cell");if(!el)return;
  const r=+el.dataset.r,c=+el.dataset.c;
  if(S.mode==="art"){if(!el.classList.contains("blank"))artClick(r,c);return;}
  if(S.locked){toggleMark(r,c);return;}
  if(el.classList.contains("blank"))return;
  if(r===S.row&&c===S.col){mainAction();return;}
  if(r===S.row){moveSlider("col",c);return;}
  if(c===S.col){moveSlider("row",r);return;}
  say(fid(),"bad","한 번에는 못 가요",
    "슬라이더를 하나만 움직일 수 있어서, 지금 자리와 같은 가로줄이나 같은 세로줄에 있는 칸으로만 갈 수 있어요.");
});

function dragify(handle,which){
  let on=false;
  handle.addEventListener("pointerdown",e=>{
    if(handle.classList.contains("locked"))return;
    on=true;handle.setPointerCapture(e.pointerId);e.preventDefault();});
  handle.addEventListener("pointermove",e=>{
    if(!on)return;
    const gr=grid.getBoundingClientRect(),s=cells["4-4"].getBoundingClientRect(),p=s.width+6;
    if(which==="row")moveSlider("row",Math.round((e.clientY-gr.top-s.height/2)/p)+1);
    else moveSlider("col",Math.round((e.clientX-gr.left-s.width/2)/p)+1);});
  const stop=e=>{on=false;try{handle.releasePointerCapture(e.pointerId);}catch(_){}};
  handle.addEventListener("pointerup",stop);handle.addEventListener("pointercancel",stop);
  handle.addEventListener("keydown",e=>{
    if(which==="row"&&(e.key==="ArrowUp"||e.key==="ArrowDown")){e.preventDefault();moveSlider("row",S.row+(e.key==="ArrowDown"?1:-1));}
    if(which==="col"&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){e.preventDefault();moveSlider("col",S.col+(e.key==="ArrowRight"?1:-1));}});
}

function reachableSet(){
  const out=new Set();
  for(let c=1;c<=COLS;c++){const k=S.row+"-"+c;if(c!==S.col&&!BLOCKED.has(k)&&!S.chips.has(k))out.add(k);}
  for(let r=1;r<=ROWS;r++){const k=r+"-"+S.col;if(r!==S.row&&!BLOCKED.has(k)&&!S.chips.has(k))out.add(k);}
  return out;
}
function toggleMark(r,c){
  const k=r+"-"+c;
  if(BLOCKED.has(k))return;
  if(S.marks.has(k))S.marks.delete(k);else S.marks.add(k);
  render();
}
function loadMission(i){
  const m=MISSIONS[i];
  S.mIndex=i;S.mDone=false;S.chips=new Map();S.marks=new Set();S.winCells=[];
  (m.chips||[]).forEach(x=>S.chips.set(x.r+"-"+x.c,x.color));
  S.row=m.start.r;S.col=m.start.c;S.moved=null;S.locked=(m.type==="count");
  document.getElementById("mStep").textContent="미션 "+(i+1)+" / "+MISSIONS.length;

                   :"슬라이더 손잡이를 끌거나, 가고 싶은 칸을 눌러 보세요.");
  render();
}
function missionAction(){
  const m=MISSIONS[S.mIndex];
  if(S.mDone){loadMission((S.mIndex+1)%MISSIONS.length);return;}
  if(m.type==="count"){
    const right=reachableSet();
    const wrong=[...S.marks].filter(k=>!right.has(k));
    const missing=[...right].filter(k=>!S.marks.has(k));
    const cur=S.row+"-"+S.col;
    if(!wrong.length&&!missing.length){
      S.mDone=true;
      say("mFeedback","good","모두 찾았어요! "+right.size+"칸이에요",m.why);
      document.getElementById("mMain").textContent=(S.mIndex===MISSIONS.length-1)?"처음으로":"다음 미션";
    }else if(wrong.length===1&&wrong[0]===cur){
      say("mFeedback","bad","지금 자리는 빼야 해요",
        "슬라이더 두 개 중 하나는 꼭 움직여야 하니까, 제자리에 그대로 놓을 수는 없어요.");
    }else if(wrong.some(k=>S.chips.has(k))){
      say("mFeedback","bad","칩이 이미 있는 칸이 섞여 있어요","다른 칩이 놓여 있는 자리에는 놓을 수 없어요.");
    }else if(wrong.length){
      say("mFeedback","bad","갈 수 없는 칸이 섞여 있어요",
        "표시한 칸 중 "+wrong.length+"칸은 지금 자리와 가로줄도 세로줄도 달라요. 슬라이더를 하나만 움직여서는 닿을 수 없어요.");
    }else{
      say("mFeedback","bad","아직 "+missing.length+"칸이 남았어요",
        "가로줄과 세로줄을 끝까지 따라가 보세요. 흰색 빈칸은 빼야 해요.");
    }
    render();return;
  }
  if(isBlank(S.row,S.col)){say("mFeedback","bad","여기엔 놓을 수 없어요","흰색 빈칸이에요.");return;}
  if(chipAt(S.row,S.col)){say("mFeedback","bad","여기엔 놓을 수 없어요","이미 칩이 놓여 있는 자리예요.");return;}
  if(S.row===m.target.r&&S.col===m.target.c){
    S.chips.set(S.row+"-"+S.col,"blue");S.mDone=true;
    say("mFeedback","good","잘했어요!",m.why);
    document.getElementById("mMain").textContent="다음 미션";
  }else{
    say("mFeedback","bad","★ 자리가 아니에요","슬라이더 두 개가 만나는 자리가 ★ 위에 오도록 다시 움직여 보세요.");
  }
  render();
}

function loadQuiz(i){

  S.qIndex=i;S.qDone=false;S.chips=new Map();S.marks=new Set();S.winCells=[];S.locked=false;
  for(const color in q.chips)q.chips[color].forEach(([r,c])=>S.chips.set(r+"-"+c,color));

function threats(q){
  const out=[],len=winLen(q.people);
  Object.keys(SETUP[q.people]).filter(c=>c!==q.turn).forEach(op=>{
    for(let r=1;r<=ROWS;r++)for(let c=1;c<=COLS;c++)
      if(winningLine(S.chips,r,c,op,len))out.push({r,c,color:op});
  });
  return out;
}
function quizAction(){
  const q=QUIZ[S.qIndex];
  if(S.qDone){loadQuiz((S.qIndex+1)%QUIZ.length);return;}
  const len=winLen(q.people);
  if(isBlank(S.row,S.col)){say("qFeedback","bad","여기엔 놓을 수 없어요","흰색 빈칸이에요.");return;}
  if(chipAt(S.row,S.col)){say("qFeedback","bad","여기엔 놓을 수 없어요","이미 칩이 놓여 있는 자리예요.");return;}
  const done=()=>{S.qDone=true;
    document.getElementById("qMain").textContent=(S.qIndex===QUIZ.length-1)?"처음으로":"다음 문제";};


  if(q.kind==="win"){
    const lines=winningLines(S.chips,S.row,S.col,q.turn,len);
    if(lines.length){
      S.chips.set(S.row+"-"+S.col,q.turn);S.winCells=mergeCells(lines);done();
      say("qFeedback","good",
        lines.length>1?"픽셀! 두 방향으로 한 줄이 됐어요":"픽셀! 한 줄을 만들었어요",
        lines.length>1
          ? pos(S.row,S.col)+"에 놓으니 "+lineNames(lines)+", 두 방향으로 동시에 "+len+"개가 이어져요."
          : pos(S.row,S.col)+"에 놓아서 "+KO[q.turn]+" 칩 "+len+"개가 "+lines[0].name+"로 이어졌어요.");
    }else{
      say("qFeedback","bad","아직 한 줄이 아니에요",
        "여기에 놓으면 "+KO[q.turn]+" 칩이 "+len+"개로 이어지지 않아요. 이미 놓인 "+KO[q.turn]+" 칩이 어느 방향으로 이어져 있는지 살펴보세요. 대각선도 한 줄이에요.");
    }
    render();return;
  }
  const list=threats(q);
  const hit=list.find(t=>t.r===S.row&&t.c===S.col);
  if(hit){
    S.chips.set(S.row+"-"+S.col,q.turn);done();
    say("qFeedback","good","잘 막았어요!",
      pos(S.row,S.col)+"은 "+KO[hit.color]+"이 한 줄을 완성할 수 있던 자리예요. 먼저 차지해서 막았어요.");
  }else{

  }
  render();
}

function renderArtTray(){
  artTray.innerHTML="";
  Object.keys(ART_STOCK).forEach(color=>{
    const b=document.createElement("button");
    b.className="tray-row";
    b.setAttribute("aria-pressed",String(color===S.artColor));
    b.innerHTML='<span class="swatch"></span><span></span><span class="count"></span>';
    b.querySelector(".swatch").style.background=CSS[color];
    b.children[1].textContent=KO[color];
    b.querySelector(".count").textContent=S.artStock[color]+" / "+ART_STOCK[color];
    b.addEventListener("click",()=>{S.artColor=color;renderArtTray();});
    artTray.appendChild(b);
  });
  const used=S.chips.size;
  document.getElementById("artTotal").textContent="판에 놓은 칩 "+used+" / 60개";
}
function artPlaceOne(r,c,color){
  const k=r+"-"+c;
  if(BLOCKED.has(k))return false;
  if(S.chips.has(k))return false;
  if(S.artStock[color]<=0)return false;
  S.chips.set(k,color);S.artStock[color]--;return true;
}
function artRemoveOne(r,c){
  const k=r+"-"+c,color=S.chips.get(k);
  if(!color)return false;
  S.chips.delete(k);S.artStock[color]++;return true;
}
function artClick(r,c){
  const k=r+"-"+c;
  const mirrorC=9-c, mirrorK=r+"-"+mirrorC;
  if(S.chips.has(k)){
    artRemoveOne(r,c);
    if(S.artMirror&&mirrorC!==c)artRemoveOne(r,mirrorC);
    say("artFeedback","","칩을 뺐어요","다시 누르면 그 자리에 칩을 놓을 수 있어요.");
  }else{
    const ok=artPlaceOne(r,c,S.artColor);
    if(!ok){
      say("artFeedback","bad",KO[S.artColor]+" 칩이 부족해요",
        KO[S.artColor]+" 칩은 "+ART_STOCK[S.artColor]+"개까지만 쓸 수 있어요. 놓은 칩을 눌러서 빼거나 다른 색을 골라 보세요.");
      render();return;
    }
    if(S.artMirror&&mirrorC!==c&&!S.chips.has(mirrorK)){
      if(!artPlaceOne(r,mirrorC,S.artColor)){
        say("artFeedback","bad",KO[S.artColor]+" 칩이 부족해요","대칭 자리까지 놓기에는 칩이 모자라요.");
        render();return;
      }
    }
    say("artFeedback","","칩을 놓았어요","같은 자리를 다시 누르면 지워져요.");
  }
  render();
}
document.getElementById("artMirror").addEventListener("change",e=>{
  S.artMirror=e.target.checked;
  say("artFeedback","",S.artMirror?"좌우 대칭으로 그려요":"대칭 도우미를 껐어요",
    S.artMirror?"한쪽에 칩을 놓으면 반대쪽에도 똑같이 놓여요. 하트나 나비처럼 좌우가 같은 그림에 편해요."
               :"이제 한 칸씩 자유롭게 놓을 수 있어요.");
});

document.getElementById("artSave").addEventListener("click",()=>{
  if(!S.chips.size){say("artFeedback","bad","아직 빈 판이에요","칩을 놓은 다음에 저장해 보세요.");return;}
  const P=64,pad=22,size=P*8+pad*2;
  const cv=document.createElement("canvas");cv.width=size;cv.height=size+34;
  const g=cv.getContext("2d");
  g.fillStyle="#8CC63F";g.fillRect(0,0,size,size);
  g.fillStyle="#FBFBF6";g.fillRect(pad-8,pad-8,P*8+16,P*8+16);
  for(let r=1;r<=8;r++)for(let c=1;c<=8;c++){
    if(BLOCKED.has(r+"-"+c))continue;
    const x=pad+(c-1)*P,y=pad+(r-1)*P;
    g.fillStyle="#93C93F";
    g.fillRect(x+2,y+2,P-4,P-4);
    const color=S.chips.get(r+"-"+c);
    if(color){g.fillStyle=CSS[color];g.beginPath();
      g.arc(x+P/2,y+P/2,P/2-6,0,Math.PI*2);g.fill();}
  }
  g.fillStyle="#2C3552";g.font="20px sans-serif";g.textAlign="center";
  g.fillText("우리 모둠 픽셀 아트 도안 · 칩 "+S.chips.size+"개",size/2,size+24);
  const a=document.createElement("a");
  a.download="픽셀아트-도안.png";a.href=cv.toDataURL("image/png");a.click();
  say("artFeedback","good","도안을 저장했어요","이 그림을 보고 실제 게임판에 칩을 옮겨 놓아 보세요.");
});

/* ===== 공통 ===== */
function mainAction(){
  if(S.mode==="mission")missionAction();
  else if(S.mode==="quiz")quizAction();
}
const PANEL={mission:"panelMission",quiz:"panelQuiz",art:"panelArt"};
function setMode(mode){
  S.mode=mode;
  Object.keys(PANEL).forEach(m=>{
    document.getElementById("tab-"+m).setAttribute("aria-selected",String(m===mode));
    document.getElementById(PANEL[m]).hidden=(m!==mode);
  });
  if(mode==="mission")loadMission(0);
  else if(mode==="quiz")loadQuiz(0);
  else resetArt();
}
Object.keys(PANEL).forEach(m=>
  document.getElementById("tab-"+m).addEventListener("click",()=>setMode(m)));

setMode("mission");
window.addEventListener("load",layout);
if(document.fonts)document.fonts.ready.then(layout);
})();
</script>
